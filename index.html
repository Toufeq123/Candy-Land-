<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ff55a4">
<title>Candy Cash Match</title>
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<main id="app">
  <section id="home" class="screen active">
    <div class="clouds"></div>
    <h1>CANDY<br><span>CASH</span></h1>
    <p>Match sweets, collect coins, clear five colorful levels.</p>
    <button id="playBtn" class="primary">Play</button>
    <button id="resetBtn" class="secondary">Reset progress</button>
  </section>

  <section id="game" class="screen">
    <header>
      <button id="homeBtn" aria-label="Home">‹</button>
      <div class="level-title">Level <span id="levelNo">1</span></div>
      <button id="soundBtn" aria-label="Sound">♪</button>
    </header>
    <div class="panel">
      <div><small>MOVES</small><b id="moves">20</b></div>
      <div class="goal"><small>GOAL</small><b><span id="goalIcon">●</span> <span id="goalCount">0/12</span></b></div>
      <div><small>SCORE</small><b id="score">0</b></div>
    </div>
    <div class="progress"><i id="progressBar"></i><span>★</span><span>★</span><span>★</span></div>
    <div id="message">Swap neighboring candies to make 3 or more.</div>
    <div id="board" aria-label="Candy match game board"></div>
    <div class="actions">
      <button id="hintBtn">💡 Hint</button>
      <button id="shuffleBtn">🔀 Shuffle</button>
    </div>
  </section>

  <section id="result" class="screen">
    <div id="confetti"></div>
    <h2 id="resultTitle">Sweet!</h2>
    <div class="stars" id="resultStars">★★★</div>
    <p id="resultText"></p>
    <button id="nextBtn" class="primary">Next Level</button>
    <button id="retryBtn" class="secondary">Retry</button>
    <button id="resultHomeBtn" class="link">Main menu</button>
  </section>
</main>
<script src="game.js"></script>
</body>
</html>
